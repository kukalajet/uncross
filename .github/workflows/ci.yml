name: CI

# Pushes to main run this workflow through the Release workflow, which calls it
# before it deploys. If you remove release.yml, add `push: { branches: [main] }`
# here.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting, lint, type checking, and unit tests.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both read the versions pinned in package.json (packageManager and
      # devEngines).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # shellcheck on the shell scripts, actionlint and zizmor on the workflows:
  # `pnpm check:static`, with the same images pinned by digest.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Static checks
        env:
          # zizmor's online audits read public data from the GitHub API; the
          # job token, read-only here, is enough.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-static.sh

  # The production image (whose build runs `pnpm check` again) against a real
  # PostgreSQL: migrations, API, health checks, and worker modes. Then a
  # vulnerability scan of that image.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The cache only speeds up this test build. A pull request reads main's
      # entries but writes only its own, and the release's publish job, whose
      # image is deployed, builds without it.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: node-effect-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        env:
          APP_IMAGE: node-effect-template:ci
        run: bash scripts/smoke-docker.sh
      # Fails on High and Critical vulnerabilities that have a fix, printing a
      # table of every fixable one. .grype.yaml says how to accept a finding.
      # scan.yml repeats this scan weekly: keep the two the same.
      - name: Scan the image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker:node-effect-template:ci
          # renovate: datasource=github-releases depName=anchore/grype
          grype-version: v0.121.0
          config: .grype.yaml
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table

  # Database adapter tests against PostgreSQL itself. Each test creates and
  # drops its own schema in this throwaway database, and the runtime role tests
  # create and drop cluster-wide roles, which needs the image's superuser.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgresql:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: node_effect
          POSTGRES_USER: node_effect
          POSTGRES_PASSWORD: node_effect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U node_effect -d node_effect"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VP_GIT_HOOKS: "0"
      DATABASE_URL: postgresql://node_effect:node_effect@127.0.0.1:5432/node_effect
      API_HOST: 127.0.0.1
      API_PORT: "8000"
      WORKER_POLL_INTERVAL_MS: "5000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres
