name: Image scan

# Rescans the image of main's head every week, so a vulnerability published
# after the last merge fails here instead of in the next pull request. It builds
# the image itself, so it needs no registry and works before the server exists.
#
# In a public repository, GitHub disables scheduled workflows after 60 days
# without repository activity. Its documentation does not define activity, but
# a push to main, such as merging a pull request, is activity. If it is
# disabled, enable it again on the Actions tab.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag uncross:scan .
      # The same scan as ci.yml's smoke job: keep the two the same.
      - name: Scan the image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker:uncross:scan
          # renovate: datasource=github-releases depName=anchore/grype
          grype-version: v0.121.0
          config: .grype.yaml
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
